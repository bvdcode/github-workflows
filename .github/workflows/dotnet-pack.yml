name: Pack NuGet packages

on:
  workflow_call:
    inputs:
      projects:
        description: Project or solution paths to pack, one per line.
        required: true
        type: string
      dotnet-version:
        required: true
        type: string
      version:
        description: MajorMinorPatch version for every package.
        required: true
        type: string
      configuration:
        type: string
        default: Release
      artifact-name:
        type: string
        default: nuget-packages
      runner:
        type: string
        default: ubuntu-latest
      repository:
        type: string
        default: ${{ github.repository }}
      ref:
        type: string
        default: ${{ github.sha }}
    outputs:
      artifact-name:
        value: ${{ jobs.pack.outputs.artifact-name }}
    secrets:
      SIXLABORS_LICENSE_KEY:
        description: Optional license used by the project build.
        required: false

permissions:
  contents: read

jobs:
  pack:
    name: Pack NuGet packages
    runs-on: ${{ inputs.runner }}
    outputs:
      artifact-name: ${{ steps.pack.outputs.artifact-name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pack project
        id: pack
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        uses: bvdcode/github-workflows/actions/dotnet-pack@v1.0.1
        with:
          projects: ${{ inputs.projects }}
          dotnet-version: ${{ inputs.dotnet-version }}
          version: ${{ inputs.version }}
          configuration: ${{ inputs.configuration }}
          artifact-name: ${{ inputs.artifact-name }}
