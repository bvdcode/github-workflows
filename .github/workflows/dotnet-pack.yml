name: Pack NuGet packages

on:
  workflow_call:
    inputs:
      projects:
        description: Project or solution paths to pack, one per line.
        required: true
        type: string
      dotnet-version:
        required: true
        type: string
      version:
        description: MajorMinorPatch version for every package.
        required: true
        type: string
      configuration:
        type: string
        default: Release
      artifact-name:
        type: string
        default: nuget-packages
      runner:
        type: string
        default: ubuntu-latest
      repository:
        type: string
        default: ${{ github.repository }}
      ref:
        type: string
        default: ${{ github.sha }}
    outputs:
      artifact-name:
        value: ${{ jobs.pack.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  pack:
    name: Pack NuGet packages
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
    env:
      PROJECTS: ${{ inputs.projects }}
      PACKAGE_VERSION: ${{ inputs.version }}
      CONFIGURATION: ${{ inputs.configuration }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Pack
        run: |
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ -n "$PROJECTS" ]]
          while IFS= read -r project || [[ -n "$project" ]]; do
            if [[ -z "$project" ]]; then
              continue
            fi
            [[ -f "$project" ]]
            dotnet pack "$project" --configuration "$CONFIGURATION" \
              --output "$RUNNER_TEMP/packages" -p:Version="$PACKAGE_VERSION" \
              -p:PackageVersion="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true
          done <<< "$PROJECTS"
      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/packages/*nupkg
          if-no-files-found: error
          retention-days: 7
