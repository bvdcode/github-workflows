name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Validate workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint \
            --pattern actionlint_1.7.12_linux_amd64.tar.gz \
            --pattern actionlint_1.7.12_checksums.txt --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          grep ' actionlint_1.7.12_linux_amd64.tar.gz$' actionlint_1.7.12_checksums.txt | sha256sum --check
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Check workflow syntax
        run: actionlint -color -shellcheck= -pyflakes= .github/workflows/*.yml examples/*.yml

  dotnet:
    name: .NET (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: TelegramBot
            repository: bvdcode/TelegramBot.NET
            ref: 1dcbfc4af15c964f63cfce17d30e594980cd5552
            project: Sources/TelegramBot.Tests/TelegramBot.Tests.csproj
            dotnet-version: 10.0.x
            test-filter: ''
          - name: Blink
            repository: bvdcode/Blink.NET
            ref: 247d2371663e1152b470e82b9e782293531d14d3
            project: Sources/Blink.Tests/Blink.Tests.csproj
            dotnet-version: 9.0.x
            test-filter: FullyQualifiedName~Blink.Tests.Unit
    uses: ./.github/workflows/dotnet-checks.yml
    with:
      repository: ${{ matrix.repository }}
      ref: ${{ matrix.ref }}
      project: ${{ matrix.project }}
      dotnet-version: ${{ matrix.dotnet-version }}
      test-filter: ${{ matrix.test-filter }}
      test-results-name: dotnet-${{ matrix.name }}

  dotnet-actions:
    name: .NET composite actions
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflows
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check out fixture
        uses: actions/checkout@v7.0.1
        with:
          repository: bvdcode/TelegramBot.NET
          ref: 1dcbfc4af15c964f63cfce17d30e594980cd5552
          path: .fixtures/dotnet
          persist-credentials: false
      - name: Prepare test settings
        run: echo '<RunSettings />' > "$RUNNER_TEMP/fixture.runsettings"
      - name: Check fixture
        uses: ./actions/dotnet-checks
        with:
          project: .fixtures/dotnet/Sources/TelegramBot.Tests/TelegramBot.Tests.csproj
          dotnet-version: 10.0.x
          test-results-name: dotnet-composite
          test-settings: ${{ runner.temp }}/fixture.runsettings
          enable-raw-icmp: true
      - name: Pack fixture
        uses: ./actions/dotnet-pack
        with:
          projects: .fixtures/dotnet/Sources/TelegramBot/TelegramBot.csproj
          dotnet-version: 10.0.x
          version: ${{ needs.version.outputs.version }}
          artifact-name: composite-nuget-packages
      - name: Validate fixture packages
        uses: ./actions/nuget-publish
        with:
          artifact-name: composite-nuget-packages
          version: ${{ needs.version.outputs.version }}
          authentication: api-key
          publish: false

  node:
    uses: ./.github/workflows/node-checks.yml
    with:
      repository: bvdcode/immich-sorter
      ref: 3a4e84e25d7256bd85573ef8858f5ee050d06019
      node-version: '24'
      typecheck-command: npm run typecheck

  python:
    uses: ./.github/workflows/python-checks.yml
    with:
      repository: bvdcode/nissan-connect-sdk
      ref: 78da3d8e738c883f032dcd37b8721795d0278cc4
      python-version: '3.14'
      install-command: python -m pip install '.[test]'

  docker:
    uses: ./.github/workflows/docker-checks.yml
    with:
      context: tests/fixtures/docker
      file: tests/fixtures/docker/Dockerfile
      platforms: linux/amd64,linux/arm64

  version:
    uses: ./.github/workflows/gitversion.yml

  package-guards:
    name: Package publication guards
    uses: ./.github/workflows/python-checks.yml
    with:
      python-version: '3.14'
      install-command: python -m pip install ruff==0.17.3 mypy==2.4.1
      lint-command: python -m ruff check --select E,F,I actions tests && python -m ruff format --check actions tests
      typecheck-command: python -m mypy --strict actions/nuget-publish/validate_packages.py tests/test_validate_packages.py
      test-command: python -m unittest discover -s tests -p 'test_*.py' -v

  nuget-package:
    needs: version
    uses: ./.github/workflows/dotnet-pack.yml
    with:
      repository: bvdcode/TelegramBot.NET
      ref: 1dcbfc4af15c964f63cfce17d30e594980cd5552
      projects: Sources/TelegramBot/TelegramBot.csproj
      dotnet-version: 10.0.x
      version: ${{ needs.version.outputs.version }}
      artifact-name: fixture-nuget-packages

  nuget-publication:
    name: NuGet (${{ matrix.authentication }})
    needs: [nuget-package, version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        authentication: [api-key, oidc]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate NuGet publication
        uses: ./actions/nuget-publish
        with:
          artifact-name: fixture-nuget-packages
          version: ${{ needs.version.outputs.version }}
          authentication: ${{ matrix.authentication }}
          publish: false

  docker-publication:
    needs: version
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      dockerhub-image: bvdcode/github-workflows-fixture
      ghcr-image: ghcr.io/bvdcode/github-workflows-fixture
      publish: false
      context: tests/fixtures/docker
      file: tests/fixtures/docker/Dockerfile
      platforms: linux/amd64,linux/arm64
      additional-tags: v${{ needs.version.outputs.version }}
      cache-scope: docker-publication-${{ github.ref_name }}

  publication-results:
    name: Validate publication tags
    needs: [docker-publication, version]
    runs-on: ubuntu-latest
    env:
      IMAGE_TAGS: ${{ needs.docker-publication.outputs.tags }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check both registry tag sets
        run: |
          python3 - <<'PYTHON'
          import os

          version = os.environ['RELEASE_VERSION']
          expected = {
              f'{image}:{tag}'
              for image in (
                  'bvdcode/github-workflows-fixture',
                  'ghcr.io/bvdcode/github-workflows-fixture',
              )
              for tag in (version, 'latest', f'v{version}')
          }
          actual = set(os.environ['IMAGE_TAGS'].splitlines())
          assert actual == expected, (actual, expected)
          PYTHON

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint, dotnet, dotnet-actions, node, python, docker, version, package-guards, nuget-publication, publication-results]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.version.outputs.version }}

  promote-major:
    name: Update major version reference
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [release, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_MAJOR: ${{ needs.version.outputs.major }}
    steps:
      - name: Update major version tag
        run: |
          tag="v$VERSION_MAJOR"
          existing=$(git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$tag")
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
          else
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
              -f "sha=$GITHUB_SHA" -F force=false --silent
          fi
