name: Publish NuGet packages
description: Publish prebuilt packages to NuGet.org and GitHub Packages in the calling job.

inputs:
  artifact-name:
    description: Artifact containing nupkg and optional snupkg files.
    required: true
  version:
    description: Expected MajorMinorPatch version of every package.
    required: true
  authentication:
    description: NuGet.org authentication method, api-key or oidc.
    required: true
  publish:
    description: Publish on main; false downloads and validates packages only.
    default: 'false'
  nuget-user:
    description: NuGet.org user owning the OIDC publishing policy.
    default: ''
  nuget-api-key:
    description: NuGet.org API key for api-key authentication.
    default: ''
  github-packages-token:
    description: Token with access to the calling repository's GitHub Packages.
    default: ''

runs:
  using: composite
  steps:
    - name: Validate publishing configuration
      shell: bash
      env:
        AUTHENTICATION: ${{ inputs.authentication }}
        PUBLISH: ${{ inputs.publish }}
        NUGET_USER: ${{ inputs.nuget-user }}
        NUGET_API_KEY: ${{ inputs.nuget-api-key }}
        PACKAGE_TOKEN: ${{ inputs.github-packages-token }}
      run: |
        case "$AUTHENTICATION" in
          api-key|oidc) ;;
          *) echo '::error::authentication must be api-key or oidc'; exit 1 ;;
        esac
        case "$PUBLISH" in
          true|false) ;;
          *) echo '::error::publish must be true or false'; exit 1 ;;
        esac
        if [[ "$PUBLISH" == 'true' ]]; then
          if [[ "$GITHUB_REF" != 'refs/heads/main' || "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            echo '::error::NuGet publication requires main outside a pull request'
            exit 1
          fi
          if [[ -z "$PACKAGE_TOKEN" ]]; then
            echo '::error::github-packages-token is required for publishing'
            exit 1
          fi
          case "$AUTHENTICATION" in
            api-key)
              if [[ -z "$NUGET_API_KEY" ]]; then
                echo '::error::nuget-api-key is required for api-key authentication'
                exit 1
              fi
              ;;
            oidc)
              if [[ -z "$NUGET_USER" ]]; then
                echo '::error::nuget-user is required for oidc authentication'
                exit 1
              fi
              ;;
          esac
        fi

    - name: Prepare package directory
      id: workspace
      shell: bash
      run: echo "path=$(mktemp -d "$RUNNER_TEMP/nuget-publication.XXXXXX")" >> "$GITHUB_OUTPUT"

    - name: Download packages
      uses: actions/download-artifact@v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.workspace.outputs.path }}/packages

    - name: Validate package versions
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        PACKAGE_DIRECTORY: ${{ steps.workspace.outputs.path }}/packages
        PACKAGE_MANIFEST: ${{ steps.workspace.outputs.path }}/packages.txt
        PACKAGE_VERSION: ${{ inputs.version }}
      run: >-
        python3 "$ACTION_DIRECTORY/validate_packages.py"
        "$PACKAGE_DIRECTORY" "$PACKAGE_VERSION" "$PACKAGE_MANIFEST"

    - name: Set up .NET
      if: inputs.publish == 'true'
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Sign in to NuGet.org
      if: inputs.publish == 'true' && inputs.authentication == 'oidc'
      id: login
      uses: NuGet/login@v1.2.0
      with:
        user: ${{ inputs.nuget-user }}

    - name: Publish packages
      if: inputs.publish == 'true'
      shell: bash
      env:
        AUTHENTICATION: ${{ inputs.authentication }}
        NUGET_STATIC_KEY: ${{ inputs.nuget-api-key }}
        NUGET_OIDC_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        PACKAGE_TOKEN: ${{ inputs.github-packages-token }}
        PACKAGE_DIRECTORY: ${{ steps.workspace.outputs.path }}
      run: |
        case "$AUTHENTICATION" in
          api-key) nuget_key="$NUGET_STATIC_KEY" ;;
          oidc) nuget_key="$NUGET_OIDC_KEY" ;;
          *) echo '::error::Unsupported NuGet authentication'; exit 1 ;;
        esac
        if [[ -z "$nuget_key" ]]; then
          echo '::error::NuGet.org did not provide a publishing key'
          exit 1
        fi
        while IFS= read -r package; do
          dotnet nuget push "$package" --skip-duplicate --api-key "$nuget_key" \
            --source https://api.nuget.org/v3/index.json
        done < "$PACKAGE_DIRECTORY/packages.txt"

        umask 077
        config="$PACKAGE_DIRECTORY/NuGet.Config"
        printf '%s\n' '<configuration><packageSources /></configuration>' > "$config"
        dotnet nuget add source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" \
          --name github --username "$GITHUB_ACTOR" --password "$PACKAGE_TOKEN" \
          --store-password-in-clear-text --configfile "$config"
        while IFS= read -r package; do
          dotnet nuget push "$package" --skip-duplicate --no-symbols \
            --api-key "$PACKAGE_TOKEN" --source github --configfile "$config"
        done < "$PACKAGE_DIRECTORY/packages.txt"

    - name: Remove package workspace
      if: always() && steps.workspace.outputs.path != ''
      shell: bash
      env:
        PACKAGE_DIRECTORY: ${{ steps.workspace.outputs.path }}
      run: rm -rf -- "$PACKAGE_DIRECTORY"
